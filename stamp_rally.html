<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>B.DOORS KANAGAWA 2026 スタンプラリー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --col-bg: #0a0a14;
  --col-card: #12121f;
  --col-border: #ffffff18;
  --col-accent: #4f8aff;
  --col-accent2: #a855f7;
  --col-stamped: #22c55e;
  --col-text: #f0f0f8;
  --col-muted: #8888aa;
  --col-gold: #fbbf24;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--col-bg);
  color: var(--col-text);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
}

/* ヘッダー */
.header {
  background: linear-gradient(135deg, #0d1b3e 0%, #1a0a2e 50%, #0d2211 100%);
  padding: 24px 20px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--col-border);
}
.header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 0%, #4f8aff22 0%, transparent 70%);
}
.header-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 4px;
  color: #fff;
  position: relative;
}
.header-sub {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--col-accent);
  margin-top: 2px;
  text-transform: uppercase;
  position: relative;
}
.header-info {
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  position: relative;
}
.badge {
  background: #ffffff12;
  border: 1px solid #ffffff20;
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 12px;
  font-weight: 700;
  color: var(--col-text);
}
.badge.school { color: var(--col-accent); border-color: var(--col-accent)44; background: var(--col-accent)11; }
.badge.grade { color: var(--col-accent2); border-color: var(--col-accent2)44; background: var(--col-accent2)11; }

/* 進捗バー */
.progress-section {
  padding: 20px 20px 16px;
  background: var(--col-card);
  border-bottom: 1px solid var(--col-border);
}
.progress-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 10px;
}
.progress-count {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  line-height: 1;
  color: var(--col-accent);
}
.progress-count span {
  font-size: 20px;
  color: var(--col-muted);
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 400;
}
.progress-label {
  font-size: 11px;
  color: var(--col-muted);
  text-align: right;
  line-height: 1.5;
}

.progress-bar-wrap {
  background: #ffffff10;
  border-radius: 4px;
  height: 8px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--col-accent), var(--col-accent2));
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
}

/* ミッション達成バナー */
.mission-banner {
  margin: 14px 20px 0;
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 700;
  display: none;
}
.mission-banner.show { display: flex; }
.mission-banner.step1 {
  background: linear-gradient(135deg, #fbbf2420, #f59e0b10);
  border: 1px solid var(--col-gold)44;
  color: var(--col-gold);
}
.mission-banner .icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--col-gold)22;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

/* セクションタイトル */
.section-title {
  padding: 20px 20px 10px;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--col-muted);
  text-transform: uppercase;
}

/* グリッド */
.booth-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 0 16px;
}

@media (min-width: 480px) {
  .booth-grid { grid-template-columns: repeat(5, 1fr); }
}

/* ブースカード */
.booth-card {
  aspect-ratio: 1;
  border-radius: 10px;
  border: 1px solid var(--col-border);
  background: var(--col-card);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s, border-color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.booth-card:active { transform: scale(0.94); }
.booth-card.stamped {
  border-color: var(--col-stamped)66;
  background: linear-gradient(135deg, #052210, #0a1a0a);
}
.booth-card.stamped::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, var(--col-stamped)18 0%, transparent 70%);
}

.booth-number {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  line-height: 1;
  color: var(--col-muted);
  transition: color 0.2s;
}
.booth-card.stamped .booth-number { color: var(--col-stamped); }

.stamp-mark {
  font-size: 20px;
  opacity: 0;
  transform: scale(0);
  transition: all 0.3s cubic-bezier(.34,1.56,.64,1);
  position: absolute;
}
.booth-card.stamped .stamp-mark {
  opacity: 1;
  transform: scale(1);
}
.booth-card.stamped .booth-number { opacity: 0; }

/* 会社名 */
.booth-name {
  font-size: 9px;
  color: var(--col-muted);
  text-align: center;
  line-height: 1.2;
  padding: 0 4px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color 0.2s;
}
.booth-card.stamped .booth-name { color: var(--col-stamped)bb; }

/* 訪問時刻 */
.visit-time {
  font-size: 8px;
  color: var(--col-stamped)88;
  position: absolute;
  bottom: 4px;
  right: 5px;
}

/* QRスキャンモーダル */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #000000cc;
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.overlay.active { display: flex; }
.sheet {
  background: #1a1a2e;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 480px;
  padding: 32px 28px 48px;
  border-top: 1px solid var(--col-border);
  animation: slideUp 0.3s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.sheet h2 {
  font-size: 20px;
  font-weight: 900;
  margin-bottom: 8px;
}
.sheet p {
  font-size: 13px;
  color: var(--col-muted);
  line-height: 1.7;
  margin-bottom: 24px;
}
.sheet-btn {
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  border: none;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 10px;
}
.sheet-btn.primary {
  background: linear-gradient(135deg, var(--col-accent), var(--col-accent2));
  color: #fff;
}
.sheet-btn.cancel {
  background: #ffffff10;
  color: var(--col-muted);
}

/* 完了画面 */
.complete-screen {
  display: none;
  position: fixed;
  inset: 0;
  background: #0a0a14;
  z-index: 200;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
}
.complete-screen.active { display: flex; }
.complete-emoji { font-size: 64px; margin-bottom: 20px; }
.complete-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 40px;
  letter-spacing: 4px;
  color: var(--col-gold);
  margin-bottom: 12px;
}
.complete-msg {
  font-size: 14px;
  color: var(--col-muted);
  line-height: 1.8;
  margin-bottom: 32px;
}
.complete-btn {
  padding: 14px 40px;
  border-radius: 100px;
  border: 1px solid var(--col-gold)66;
  background: var(--col-gold)11;
  color: var(--col-gold);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

/* フッター */
.footer-note {
  text-align: center;
  font-size: 10px;
  color: var(--col-muted);
  padding: 24px 20px 0;
  line-height: 1.8;
}
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <div class="header-logo">B.DOORS KANAGAWA 2026</div>
  <div class="header-sub">Stamp Rally</div>
  <div class="header-info">
    <span class="badge school" id="badge-school">学校名</span>
    <span class="badge grade" id="badge-grade">学年</span>
  </div>
</div>

<!-- 進捗 -->
<div class="progress-section">
  <div class="progress-row">
    <div class="progress-count"><span id="stamp-count">0</span><span> / 63</span></div>
    <div class="progress-label">5件達成で<br>抽選に参加できます</div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>
</div>

<!-- ミッション達成バナー -->
<div class="mission-banner step1" id="banner-step1">
  <div class="icon">🎉</div>
  <div>5件達成！抽選会場へ<br>行けるようになりました</div>
</div>

<div class="section-title">ブース一覧</div>

<!-- ブースグリッド -->
<div class="booth-grid" id="booth-grid"></div>

<p class="footer-note">
  各ブースに掲示されているQRコードを読み取って<br>スタンプを集めましょう
</p>

<!-- QRスキャン誘導モーダル -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheet-title">ブースを訪問</h2>
    <p id="sheet-desc">ブースのQRコードを読み取ってスタンプを押しましょう。</p>
    <button class="sheet-btn primary" onclick="simulateStamp()">✓ スタンプを押す（テスト用）</button>
    <button class="sheet-btn cancel" onclick="closeSheet()">キャンセル</button>
  </div>
</div>

<!-- 完了画面 -->
<div class="complete-screen" id="complete-screen">
  <div class="complete-emoji">🏆</div>
  <div class="complete-title">全ブース制覇！</div>
  <div class="complete-msg">
    63ブースすべてを訪問しました。<br>
    ありがとうございました！
  </div>
  <button class="complete-btn" onclick="document.getElementById('complete-screen').classList.remove('active')">
    カードを確認する
  </button>
</div>

<script>
// ================================================================
//  設定エリア（実際の運用時はここを書き換えます）
// ================================================================

// URLパラメータから学校名・学年を取得
const params = new URLSearchParams(location.search);
const school = params.get('school') || '';
const grade  = params.get('grade')  || '';

// ブース名（実際のブース名に差し替えてください）
const BOOTHS = [
  "A社","B社","C社","D社","E社","F社","G社",
  "ブース8","ブース9","ブース10",
  "ブース11","ブース12","ブース13","ブース14","ブース15",
  "ブース16","ブース17","ブース18","ブース19","ブース20",
  "ブース21","ブース22","ブース23","ブース24","ブース25",
  "ブース26","ブース27","ブース28","ブース29","ブース30",
  "ブース31","ブース32","ブース33","ブース34","ブース35",
  "ブース36","ブース37","ブース38","ブース39","ブース40",
  "ブース41","ブース42","ブース43","ブース44","ブース45",
  "ブース46","ブース47","ブース48","ブース49","ブース50",
  "ブース51","ブース52","ブース53","ブース54","ブース55",
  "ブース56","ブース57","ブース58","ブース59","ブース60",
  "ブース61","ブース62","ブース63"
];

// GASのWebアプリURL（後で差し替え）
const GAS_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

// ================================================================

// バッジに学校名・学年を反映
document.getElementById('badge-school').textContent = school || '（学校名）';
document.getElementById('badge-grade').textContent  = grade  ? grade + '年生' : '（学年）';

// スタンプ状態をローカルストレージで管理（オフライン対応）
const STORAGE_KEY = 'bdoors2026_stamps_' + school + '_' + grade;
let stamps = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

// 送信待ちキュー（オフライン時に溜めておく）
const QUEUE_KEY = 'bdoors2026_queue';
let queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');

let selectedBooth = null;

// ブースグリッドを生成
function buildGrid() {
  const grid = document.getElementById('booth-grid');
  grid.innerHTML = '';
  BOOTHS.forEach((name, i) => {
    const num = i + 1;
    const isStamped = !!stamps[num];
    const card = document.createElement('div');
    card.className = 'booth-card' + (isStamped ? ' stamped' : '');
    card.innerHTML = `
      <div class="booth-number">${num}</div>
      <div class="stamp-mark">✓</div>
      <div class="booth-name">${name}</div>
      ${isStamped && stamps[num].time ? `<div class="visit-time">${stamps[num].time}</div>` : ''}
    `;
    if (!isStamped) {
      card.onclick = () => openSheet(num, name);
    }
    grid.appendChild(card);
  });
  updateProgress();
}

// 進捗を更新
function updateProgress() {
  const count = Object.keys(stamps).length;
  document.getElementById('stamp-count').textContent = count;
  const pct = Math.min((count / 63) * 100, 100);
  document.getElementById('progress-bar').style.width = pct + '%';

  // 5件達成バナー
  if (count >= 5) {
    document.getElementById('banner-step1').classList.add('show');
  }

  // 全件達成
  if (count >= 63) {
    setTimeout(() => {
      document.getElementById('complete-screen').classList.add('active');
    }, 800);
  }
}

// シートを開く
function openSheet(num, name) {
  selectedBooth = { num, name };
  document.getElementById('sheet-title').textContent = name;
  document.getElementById('sheet-desc').textContent =
    `ブース ${num}「${name}」のQRコードを読み取るとスタンプが押されます。`;
  document.getElementById('overlay').classList.add('active');
}

function closeSheet() {
  document.getElementById('overlay').classList.remove('active');
  selectedBooth = null;
}

// スタンプを押す処理（実際はブースQRのURLから直接呼ばれます）
function doStamp(boothNum, boothName) {
  if (stamps[boothNum]) return; // 二重押し防止

  const now = new Date();
  const timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
  stamps[boothNum] = { time: timeStr, boothName };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(stamps));

  // 送信データを作成してキューに追加
  const record = {
    school, grade,
    boothNum, boothName,
    timestamp: now.toISOString()
  };
  queue.push(record);
  localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));

  // オンラインなら即時送信、オフラインならキューに残す
  sendQueue();

  buildGrid();
}

// テスト用（本番では削除）
function simulateStamp() {
  if (!selectedBooth) return;
  closeSheet();
  setTimeout(() => doStamp(selectedBooth.num, selectedBooth.name), 200);
}

// キューの内容をGASに送信する
async function sendQueue() {
  if (queue.length === 0) return;
  if (!navigator.onLine) return;

  const toSend = [...queue];
  try {
    for (const record of toSend) {
      const url = new URL(GAS_URL);
      Object.entries(record).forEach(([k,v]) => url.searchParams.set(k, v));
      await fetch(url.toString(), { method: 'GET', mode: 'no-cors' });
    }
    // 送信成功したらキューをクリア
    queue = [];
    localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
  } catch(e) {
    // 失敗したらキューに残したまま次回再送
    console.log('送信待機中...');
  }
}

// オンラインに戻ったら自動送信
window.addEventListener('online', sendQueue);

// URLパラメータにブース番号がある場合（ブースQRから直接遷移してきた場合）
const boothParam = params.get('booth');
if (boothParam) {
  const boothNum = parseInt(boothParam);
  if (boothNum >= 1 && boothNum <= 63) {
    const boothName = BOOTHS[boothNum - 1];
    // 少し待ってからスタンプ（ページ読み込み完了後）
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (!stamps[boothNum]) {
          doStamp(boothNum, boothName);
        }
      }, 400);
    });
  }
}

// ページロード
buildGrid();
// 起動時にも未送信データがあれば送信試行
sendQueue();
</script>
</body>
</html>
